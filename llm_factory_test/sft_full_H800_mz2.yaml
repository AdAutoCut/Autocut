### model
model_name_or_path: saves/qwen-8b-full-0831/checkpoint-6000
resize_vocab: false

### method
stage: sft
do_train: true
# do_eval: true
finetuning_type: full
enable_liger_kernel: true
packing: false 
deepspeed: LLaMA-Factory/examples/deepspeed/ds_z3_offload_config.json
flash_attn: auto
template: qwen3

### dataset
dataset_dir: /data/phd/qinsizhong/llm_factory_test/data/
dataset: sft_901_train
cutoff_len: 2000
# max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16
enable_thinking: false

### output
output_dir: saves/qwen-8b-sft-0923
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true
report_to: wandb

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 5
lr_scheduler_type: cosine
warmup_ratio: 0.1
# fp16: true
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: sft_901_eval
# val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: 'steps'
eval_steps: 500
eval_on_start: true
