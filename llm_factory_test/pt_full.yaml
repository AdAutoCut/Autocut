### model
model_name_or_path: saves/qwen-0.6b-emb-0717/checkpoint-600
resize_vocab: false

### method
stage: pt
do_train: true
# do_eval: true
finetuning_type: full
enable_liger_kernel: true # 推荐默认开启，显著节省显存和加速
packing: true
flash_attn: auto

### dataset
dataset_dir: /data/phd/qinsizhong/llm_factory_test/data/
dataset: incycle_1d_train
# eval_dataset: incycle_1d_eval
cutoff_len: 8096
# max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/qwen-0.6b-full-0717
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true
report_to: wandb

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
ddp_timeout: 180000000
