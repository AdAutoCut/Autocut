### model
model_name_or_path: saves/qwen-8b-emb-0831
resize_vocab: false

### method
stage: sft
do_train: true
# do_eval: true
finetuning_type: full
enable_liger_kernel: true
packing: false 
deepspeed: LLaMA-Factory/examples/deepspeed/ds_z2_config.json
flash_attn: fa3
template: qwen3

### dataset
dataset_dir: /data/phd/qinsizhong/llm_factory_test/data/
dataset: sft_1109_train
cutoff_len: 4000
# max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/qwen-8b-sft-1112_ablation_basesft
logging_steps: 10
save_steps: 2000
plot_loss: true
overwrite_output_dir: true
report_to: wandb

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
# fp16: true
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: sft_1109_eval
# val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: 'steps'
eval_steps: 500
eval_on_start: true
